<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nav Island — прототип v5</title>
  <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
  <style>
    :root {
      --bg: #ffffff;
      --text: #000;
      --hint: #8e8e93;

      --island-h: 68px;
      --island-gap: 14px;
      --island-bottom: calc(var(--island-gap) + env(safe-area-inset-bottom));
      --island-pad: 6px;

      /* Цвета текста островка */
      --island-accent: #6AB3F3;
      --island-gray: rgba(20, 60, 100, 0.75);

      --island-bg: rgba(36, 123, 192, 0.18);
      --island-border: rgba(36, 123, 192, 0.32);
      --island-inset: rgba(255, 255, 255, 0.6);
      --island-lens-bg: rgba(255, 255, 255, 0.6);
      --island-lens-inset: rgba(255, 255, 255, 0.95);
    }

    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      overscroll-behavior: none;
    }

    body { position: relative; }

    /* ЭКРАНЫ */
    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
    }
    .screen.active { display: flex; }
    .screen h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .screen p {
      font-size: 15px;
      color: var(--hint);
    }

    .hint {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      top: calc(env(safe-area-inset-top) + 20px);
      font-size: 12px;
      color: var(--hint);
      text-align: center;
      max-width: 90vw;
      line-height: 1.5;
      padding: 0 16px;
      pointer-events: none;
      z-index: 5;
    }

    /* ===== ОСТРОВОК ===== */
    .nav-island {
      position: fixed;
      left: 50%;
      bottom: var(--island-bottom);
      transform: translateX(-50%);
      height: var(--island-h);
      padding: var(--island-pad);
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 2px;
      border-radius: 50px;
      background: var(--island-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--island-border);
      box-shadow:
        inset 0px 2px 4px var(--island-inset),
        0 8px 24px rgba(20, 45, 80, 0.22),
        0 2px 6px rgba(20, 45, 80, 0.14);
      z-index: 60;
      min-width: 280px;
      max-width: calc(100vw - 32px);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      contain: layout paint;
    }

    /* ===== КНОПКИ =====
       Текст и иконка — один слой. Цвет — градиент серый→голубой.
       Позиция градиента задаётся через --gx (координата границы в пикселях
       относительно островка). Двигается вместе с линзой. */
    .nav-btn {
      position: relative;
      z-index: 2;
      flex: 1;
      height: 100%;
      padding: 0 14px;
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1px;
      cursor: pointer;
      border-radius: 50px;
      white-space: nowrap;
      pointer-events: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .nav-btn svg { display: block; }

    /* Внутренний контент кнопки — общий цвет через градиент.
       Применяем к SVG (через stroke/fill) и к span (через color).
       Градиент строится в CSS-переменных кнопки, обновляется из JS. */
    .nav-btn .nav-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      /* background-clip: text даёт градиент на тексте. Но у нас ещё SVG,
         поэтому SVG красим через stroke через currentColor,
         а цвет currentColor ставим через градиент на SVG-обёртке. */
    }

    /* ВАЖНО: единый градиент для иконки и текста через CSS-маску.
       Реализуем так: SVG и span получают один и тот же градиент как "цвет"
       через background-clip. */

    /* Текст (span) — background-clip: text */
    .nav-btn .nav-text {
      background-image: var(--btn-gradient);
      background-repeat: no-repeat;
      background-attachment: local;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    /* SVG — заливка/обводка через маску, потому что у SVG нельзя background-clip.
       Трюк: рисуем SVG поверх градиентного блока и используем mask через тот же SVG. */

    /* Более простой способ для SVG: используем SVG-градиент внутри svg.
       Он задаётся через <linearGradient> и обновляется из JS по X. */

    /* Итого: SVG — через SVG-градиент (gradientUnits="userSpaceOnUse"),
       текст — через background-clip: text. Оба используют одну и ту же
       пару границ. Синхронизация — из JS. */

    /* ===== ЛИНЗА ===== */
    .nav-lens {
      position: absolute;
      top: var(--island-pad);
      left: 0;
      height: calc(var(--island-h) - var(--island-pad) * 2);
      border-radius: 50px;
      background: var(--island-lens-bg);
      box-shadow:
        inset 0px 3px 6px var(--island-lens-inset),
        inset 0px -1px 2px rgba(255, 255, 255, 0.25),
        0 2px 8px rgba(20, 45, 80, 0.18);
      z-index: 1;
      pointer-events: none;
      will-change: transform, width;
      transform: translate3d(0, 0, 0);
      transition: transform 0.32s cubic-bezier(0.25, 1, 0.5, 1),
                  width 0.32s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .nav-island.dragging .nav-lens { transition: none; }
  </style>
</head>
<body>

  <div class="hint">
    Тапни или потяни линзу — буквы голубеют ровно под стеклом
  </div>

  <div class="screen active" id="screen-home">
    <h1>Главное</h1>
    <p>Это тестовый экран «Главное»</p>
  </div>
  <div class="screen" id="screen-subscription">
    <h1>Подписки</h1>
    <p>Это тестовый экран «Подписки»</p>
  </div>
  <div class="screen" id="screen-settings">
    <h1>Профиль</h1>
    <p>Это тестовый экран «Профиль»</p>
  </div>

  <nav class="nav-island" id="nav-island">
    <div class="nav-lens" id="nav-lens"></div>

    <button class="nav-btn" data-tab="home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon>
        <defs>
          <linearGradient id="iconGrad-home" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="24" y2="0">
            <stop offset="0" stop-color="var(--island-gray)"/>
            <stop offset="0" stop-color="var(--island-accent)"/>
          </linearGradient>
        </defs>
        <path d="M3 10.5L12 3l9 7.5" stroke="url(#iconGrad-home)"/>
        <path d="M5 9.5V21h14V9.5" stroke="url(#iconGrad-home)"/>
      </svg>
      <span class="nav-text" data-text>Главное</span>
    </button>

    <button class="nav-btn" data-tab="subscription">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon>
        <defs>
          <linearGradient id="iconGrad-sub" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="24" y2="0">
            <stop offset="0" stop-color="var(--island-gray)"/>
            <stop offset="0" stop-color="var(--island-accent)"/>
          </linearGradient>
        </defs>
        <rect x="2" y="5" width="20" height="14" rx="2" stroke="url(#iconGrad-sub)"/>
        <path d="M2 10h20" stroke="url(#iconGrad-sub)"/>
      </svg>
      <span class="nav-text" data-text>Подписки</span>
    </button>

    <button class="nav-btn" data-tab="settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-icon>
        <defs>
          <linearGradient id="iconGrad-set" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="24" y2="0">
            <stop offset="0" stop-color="var(--island-gray)"/>
            <stop offset="0" stop-color="var(--island-accent)"/>
          </linearGradient>
        </defs>
        <circle cx="12" cy="8" r="4" stroke="url(#iconGrad-set)"/>
        <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="url(#iconGrad-set)"/>
      </svg>
      <span class="nav-text" data-text>Профиль</span>
    </button>
  </nav>

<script>
(function () {
  /* ===== Telegram mock ===== */
  if (!window.Telegram || !window.Telegram.WebApp) {
    window.Telegram = {
      WebApp: {
        ready: () => {}, expand: () => {},
        HapticFeedback: {
          impactOccurred: () => {},
          notificationOccurred: () => {},
          selectionChanged: () => {}
        }
      }
    };
  }
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  function haptic(type) {
    try {
      const hf = tg.HapticFeedback;
      if (!hf) return;
      if (type === 'light') hf.impactOccurred('light');
      else if (type === 'select') hf.selectionChanged();
    } catch (e) {}
  }

  /* ===== STATE ===== */
  const TABS = ['home', 'subscription', 'settings'];
  let currentTab = 'home';
  let hoverTab = 'home';

  const island = document.getElementById('nav-island');
  const lens = document.getElementById('nav-lens');
  const buttons = Array.from(island.querySelectorAll('.nav-btn'));

  /* ===== SCREEN SWITCH ===== */
  function showScreen(tab) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const next = document.getElementById('screen-' + tab);
    if (next) next.classList.add('active');
    currentTab = tab;
  }

  /* ===== GRADIENT ENGINE =====
     Для каждой кнопки вычисляем локальную координату левого и правого края
     линзы. Строим градиент серый→голубой, где переход — 2px.
     Для текста: background-image: linear-gradient(...).
     Для SVG: обновляем x1/x2 у <linearGradient>.
     Всё в координатах элемента (кнопки или svg). */

  const TRANSITION_SOFTNESS = 2; // px

  function updateGradients(lensLeft, lensWidth) {
    const lensRight = lensLeft + lensWidth;

    buttons.forEach(btn => {
      const btnLeft = btn.offsetLeft;      // в координатах островка
      const btnWidth = btn.offsetWidth;

      // Локальные координаты линзы в этой кнопке
      // (в пикселях от левого края кнопки)
      const localLensLeft = lensLeft - btnLeft;
      const localLensRight = lensRight - btnLeft;

      // Градиент для текста — задаём через background-image
      // Порядок стопов: [gray до localLensLeft-soft],
      //                 [accent с localLensLeft],
      //                 [accent до localLensRight],
      //                 [gray с localLensRight+soft]
      // Внутри — всё голубое, снаружи — серое.
      const textEl = btn.querySelector('[data-text]');
      if (textEl) {
        // background-size: 100% высоты, но нужен по ширине кнопки — используем
        // проценты от ширины кнопки. Для этого переводим пиксели в проценты.
        // Проще: используем px через calc? Нет. Проще — использовать
        // background-position + статичный градиент заданной ширины.

        // Мы задаём градиент шириной = ширине кнопки (в px), а потом
        // сдвигаем его через background-position. Но проще всего — задать
        // градиент с px-координатами через background-image напрямую,
        // используя calc() и css-переменные.

        // Самый простой путь: linear-gradient(90deg, ...) с точными px —
        // это работает, потому что background-image принимает любые единицы.
        const soft = TRANSITION_SOFTNESS;
        const g = `linear-gradient(90deg,
          var(--island-gray) 0,
          var(--island-gray) ${localLensLeft - soft}px,
          var(--island-accent) ${localLensLeft}px,
          var(--island-accent) ${localLensRight}px,
          var(--island-gray) ${localLensRight + soft}px,
          var(--island-gray) 100%)`;

        textEl.style.backgroundImage = g;
      }

      // Градиент для SVG — обновляем x1/x2 у linearGradient.
      // SVG viewBox 24x24, реальный размер 20x20. Локальные координаты
      // линзы в кнопке нужно перевести в координаты SVG (0..24).
      // Кнопка шире SVG, SVG по центру. Считаем смещение SVG внутри кнопки.
      const svg = btn.querySelector('[data-icon]');
      if (svg) {
        const svgRect = svg.getBoundingClientRect();
        const btnRect = btn.getBoundingClientRect();
        const svgOffsetX = svgRect.left - btnRect.left; // px
        const svgWidthPx = svgRect.width;               // px (20)
        const scale = 24 / svgWidthPx;                  // px → SVG units

        // Локальные координаты линзы в системе SVG-координат (0..24)
        const svgLensLeft = (lensLeft - btnLeft - svgOffsetX) * scale;
        const svgLensRight = (lensRight - btnLeft - svgOffsetX) * scale;
        const svgSoft = TRANSITION_SOFTNESS * scale;

        const grad = svg.querySelector('linearGradient');
        if (grad) {
          // Один общий переход: серый → голубой на границе линзы слева
          // и голубой → серый на границе справа.
          // linearGradient не поддерживает «полосы», но можно использовать
          // несколько стопов с offset — offset задаётся в 0..1 или в юнитах.
          // С gradientUnits="userSpaceOnUse" offset — в юнитах (0..24).

          // Зададим стопы в юнитах:
          const stops = [
            { off: 0, color: 'var(--island-gray)' },
            { off: Math.max(0, svgLensLeft - svgSoft), color: 'var(--island-gray)' },
            { off: Math.max(0, svgLensLeft), color: 'var(--island-accent)' },
            { off: Math.min(24, svgLensRight), color: 'var(--island-accent)' },
            { off: Math.min(24, svgLensRight + svgSoft), color: 'var(--island-gray)' },
            { off: 24, color: 'var(--island-gray)' }
          ];

          // Пересоздаём стопы
          while (grad.firstChild) grad.removeChild(grad.firstChild);
          stops.forEach(s => {
            const stop = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
            stop.setAttribute('offset', s.off + '');
            stop.setAttribute('stop-color', s.color);
            grad.appendChild(stop);
          });

          grad.setAttribute('x1', '0');
          grad.setAttribute('x2', '24');
        }
      }
    });
  }

  /* ===== GEOMETRY ===== */
  let geo = null;

  function rebuildGeometry() {
    const ir = island.getBoundingClientRect();
    const pad = 6;
    const bs = buttons.map(b => {
      const r = b.getBoundingClientRect();
      return {
        tab: b.dataset.tab,
        left: r.left - ir.left,
        width: r.width,
        center: r.left - ir.left + r.width / 2
      };
    });

    const mids = [];
    for (let i = 0; i < bs.length - 1; i++) {
      mids.push((bs[i].center + bs[i + 1].center) / 2);
    }

    geo = { islandW: ir.width, pad, buttons: bs, mids };
  }

  function btnByTab(tab) {
    return geo.buttons.find(b => b.tab === tab);
  }

  /* ===== LENS + GRADIENT ===== */
  const MIN_STRETCH = 0;
  const MAX_STRETCH = 10;
  const STRETCH_K = 60;

  function applyLens(left, width, useTransition) {
    lens.style.transition = useTransition ? '' : 'none';
    lens.style.transform = `translate3d(${left}px, 0, 0)`;
    lens.style.width = width + 'px';
    updateGradients(left, width);
  }

  function snapTo(tab, useTransition) {
    const b = btnByTab(tab);
    if (!b) return;
    applyLens(b.left, b.width, useTransition);
  }

  /* ===== HOVER ===== */
  function setHover(tab) {
    if (hoverTab === tab) return;
    hoverTab = tab;
    haptic('select');
  }

  function tabFromCenter(x) {
    if (x < geo.mids[0]) return geo.buttons[0].tab;
    if (x > geo.mids[geo.mids.length - 1]) return geo.buttons[geo.buttons.length - 1].tab;
    for (let i = 0; i < geo.mids.length - 1; i++) {
      if (x >= geo.mids[i] && x <= geo.mids[i + 1]) return geo.buttons[i + 1].tab;
    }
    let best = geo.buttons[0], bd = Infinity;
    for (const b of geo.buttons) {
      const d = Math.abs(b.center - x);
      if (d < bd) { bd = d; best = b; }
    }
    return best.tab;
  }

  /* ===== DRAG ===== */
  let pointerId = null;
  let startX = 0;
  let startY = 0;
  let lastX = 0;
  let lastT = 0;
  let velocity = 0;
  let didDrag = false;
  let pendingFrame = false;
  let pendingX = 0;
  const DRAG_THRESHOLD = 8;

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function pointerToLocal(clientX) {
    const ir = island.getBoundingClientRect();
    return clientX - ir.left;
  }

  function onPointerDown(e) {
    if (pointerId !== null) return;
    if (!geo) rebuildGeometry();

    pointerId = e.pointerId;
    try { island.setPointerCapture(pointerId); } catch (_) {}

    const localX = pointerToLocal(e.clientX);
    startX = localX;
    startY = e.clientY;
    lastX = localX;
    lastT = performance.now();
    velocity = 0;
    didDrag = false;
    pendingX = localX;

    const b = btnByTab(hoverTab) || geo.buttons[0];
    island.classList.add('dragging');
    applyLens(b.left, b.width, false);
  }

  function onPointerMove(e) {
    if (e.pointerId !== pointerId) return;

    const localX = pointerToLocal(e.clientX);
    const dxTotal = Math.abs(localX - startX);
    const dyTotal = Math.abs(e.clientY - startY);

    if (!didDrag && (dxTotal > DRAG_THRESHOLD || dyTotal > DRAG_THRESHOLD)) {
      didDrag = true;
    }
    if (!didDrag) return;

    pendingX = localX;

    const now = performance.now();
    const dt = Math.max(1, now - lastT);
    velocity = (localX - lastX) / dt;
    lastX = localX;
    lastT = now;

    if (!pendingFrame) {
      pendingFrame = true;
      requestAnimationFrame(renderDragFrame);
    }
  }

  function renderDragFrame() {
    pendingFrame = false;
    if (pointerId === null) return;

    const x = pendingX;
    const targetTab = tabFromCenter(x);
    const b = btnByTab(targetTab);
    if (!b) return;

    const stretch = clamp(Math.abs(velocity) * STRETCH_K, MIN_STRETCH, MAX_STRETCH);
    const baseWidth = b.width;
    const width = baseWidth + stretch;

    let left = x - width / 2;
    const minLeft = geo.pad;
    const maxLeft = geo.islandW - geo.pad - width;
    left = clamp(left, minLeft, maxLeft);

    applyLens(left, width, false);
    setHover(targetTab);
  }

  function onPointerUp(e) {
    if (e.pointerId !== pointerId) return;
    try { island.releasePointerCapture(pointerId); } catch (_) {}
    island.classList.remove('dragging');
    pointerId = null;

    if (didDrag && geo) {
      const targetTab = tabFromCenter(pendingX);
      setHover(targetTab);
      commit(targetTab);
      return;
    }

    const localX = pointerToLocal(e.clientX);
    commit(tabFromCenter(localX));
  }

  function onPointerCancel(e) {
    if (e.pointerId !== pointerId) return;
    island.classList.remove('dragging');
    pointerId = null;
    commit(currentTab);
  }

  function commit(tab) {
    if (!TABS.includes(tab)) tab = currentTab;
    hoverTab = tab;

    const b = btnByTab(tab);
    if (b) {
      // Включаем transition — линза плавно доедет, градиент обновится
      // в rAF-цикле, который читает актуальное положение линзы.
      lens.style.transition = '';
      applyLens(b.left, b.width, true);

      // Запускаем rAF-цикл, который будет обновлять градиенты, пока
      // линза едет через transition.
      startGradientTracking();
    }

    if (tab !== currentTab) {
      showScreen(tab);
      haptic('light');
    } else {
      haptic('light');
    }
  }

  /* ===== GRADIENT TRACKING =====
     Пока линза движется через transition, обновляем градиенты из её
     текущего computedStyle. Это читает стили, но только в момент
     анимации commit (короткий отрезок ~320мс), не во время drag. */
  let tracking = false;
  let trackEnd = 0;

  function startGradientTracking() {
    if (tracking) return;
    tracking = true;
    trackEnd = performance.now() + 400;
    requestAnimationFrame(trackFrame);
  }

  function trackFrame() {
    if (!tracking) return;
    const now = performance.now();

    const cs = getComputedStyle(lens);
    const m = new DOMMatrixReadOnly(cs.transform);
    const tx = m.m41;
    const w = parseFloat(cs.width);
    if (!isNaN(tx) && !isNaN(w)) {
      updateGradients(tx, w);
    }

    if (now < trackEnd) {
      requestAnimationFrame(trackFrame);
    } else {
      tracking = false;
    }
  }

  /* ===== EVENTS ===== */
  island.addEventListener('pointerdown', onPointerDown);
  island.addEventListener('pointermove', onPointerMove);
  island.addEventListener('pointerup', onPointerUp);
  island.addEventListener('pointercancel', onPointerCancel);

  buttons.forEach(btn => {
    btn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); });
  });
  island.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });

  /* ===== INIT ===== */
  function initAll() {
    rebuildGeometry();
    snapTo(currentTab, false);
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => requestAnimationFrame(initAll));
  }
  requestAnimationFrame(initAll);
  window.addEventListener('load', () => requestAnimationFrame(initAll));
  window.addEventListener('resize', () => {
    if (pointerId === null) {
      rebuildGeometry();
      snapTo(currentTab, false);
    }
  });

})();
</script>
</body>
</html>
