<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nav Island — прототип v4</title>
  <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
  <style>
    :root {
      --bg: #ffffff;
      --text: #000;
      --hint: #8e8e93;

      --island-h: 68px;
      --island-gap: 14px;
      --island-bottom: calc(var(--island-gap) + env(safe-area-inset-bottom));
      --island-pad: 6px;

      --island-accent: #6AB3F3;

      --island-bg: rgba(36, 123, 192, 0.18);
      --island-border: rgba(36, 123, 192, 0.32);
      --island-inset: rgba(255, 255, 255, 0.6);
      --island-text: rgba(20, 60, 100, 0.75);
      --island-lens-bg: rgba(255, 255, 255, 0.6);
      --island-lens-inset: rgba(255, 255, 255, 0.95);
    }

    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      overscroll-behavior: none;
    }

    body { position: relative; }

    /* ЭКРАНЫ */
    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
    }
    .screen.active { display: flex; }

    .screen h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .screen p {
      font-size: 15px;
      color: var(--hint);
    }

    .hint {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      top: calc(env(safe-area-inset-top) + 20px);
      font-size: 12px;
      color: var(--hint);
      text-align: center;
      max-width: 90vw;
      line-height: 1.5;
      padding: 0 16px;
      pointer-events: none;
      z-index: 5;
    }

    /* ===== ОСТРОВОК ===== */
    .nav-island {
      position: fixed;
      left: 50%;
      bottom: var(--island-bottom);
      transform: translateX(-50%);
      height: var(--island-h);
      padding: var(--island-pad);
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 2px;
      border-radius: 50px;
      background: var(--island-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--island-border);
      box-shadow:
        inset 0px 2px 4px var(--island-inset),
        0 8px 24px rgba(20, 45, 80, 0.22),
        0 2px 6px rgba(20, 45, 80, 0.14);
      z-index: 60;
      min-width: 280px;
      max-width: calc(100vw - 32px);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      contain: layout paint;
    }

    /* ===== ОРИГИНАЛЬНЫЕ (серые) кнопки ===== */
    .nav-btn {
      position: relative;
      z-index: 2;
      flex: 1;
      height: 100%;
      padding: 0 14px;
      border: none;
      background: transparent;
      color: var(--island-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1px;
      cursor: pointer;
      border-radius: 50px;
      white-space: nowrap;
      pointer-events: none;
    }
    .nav-btn svg { display: block; }

    /* ===== ЛИНЗА ===== */
    .nav-lens {
      position: absolute;
      top: var(--island-pad);
      left: 0;
      height: calc(var(--island-h) - var(--island-pad) * 2);
      border-radius: 50px;
      background: var(--island-lens-bg);
      box-shadow:
        inset 0px 3px 6px var(--island-lens-inset),
        inset 0px -1px 2px rgba(255, 255, 255, 0.25),
        0 2px 8px rgba(20, 45, 80, 0.18);
      z-index: 3;
      pointer-events: none;
      will-change: transform, width;
      transform: translate3d(0, 0, 0);
      transition: transform 0.32s cubic-bezier(0.25, 1, 0.5, 1),
                  width 0.32s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .nav-island.dragging .nav-lens { transition: none; }

    /* ===== ОКНО ГОЛУБОГО СЛОЯ =====
       Блок размером ровно с линзу. border-radius: 50px, overflow: hidden.
       Внутри — копии кнопок, сдвинутые на -lensLeft, чтобы окно показывало
       правильный кусок островка. Двигается вместе с линзой. */
    .nav-blue-window {
      position: absolute;
      top: var(--island-pad);
      left: 0;
      height: calc(var(--island-h) - var(--island-pad) * 2);
      border-radius: 50px;
      overflow: hidden;
      z-index: 4; /* над линзой — голубые буквы поверх стекла */
      pointer-events: none;
      will-change: transform, width;
      transform: translate3d(0, 0, 0);
      transition: transform 0.32s cubic-bezier(0.25, 1, 0.5, 1),
                  width 0.32s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .nav-island.dragging .nav-blue-window { transition: none; }

    /* Внутренний трек — сдвигается на -lensLeft, чтобы копии кнопок
       «стояли на месте» в координатах островка */
    .nav-blue-track {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      will-change: transform;
      transform: translate3d(0, 0, 0);
      transition: transform 0.32s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .nav-island.dragging .nav-blue-track { transition: none; }

    /* Копии кнопок внутри трека — позиционируются абсолютно,
       пиксель-в-пиксель по координатам оригинала */
    .nav-blue-clone {
      position: absolute;
      top: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1px;
      white-space: nowrap;
      color: var(--island-accent);
      pointer-events: none;
      user-select: none;
    }
    .nav-blue-clone svg { display: block; }
  </style>
</head>
<body>

  <div class="hint">
    Тапни или потяни линзу — буквы голубеют ровно под стеклом
  </div>

  <div class="screen active" id="screen-home">
    <h1>Главное</h1>
    <p>Это тестовый экран «Главное»</p>
  </div>
  <div class="screen" id="screen-subscription">
    <h1>Подписки</h1>
    <p>Это тестовый экран «Подписки»</p>
  </div>
  <div class="screen" id="screen-settings">
    <h1>Профиль</h1>
    <p>Это тестовый экран «Профиль»</p>
  </div>

  <nav class="nav-island" id="nav-island">
    <div class="nav-lens" id="nav-lens"></div>

    <div class="nav-blue-window" id="nav-blue-window">
      <div class="nav-blue-track" id="nav-blue-track"></div>
    </div>

    <button class="nav-btn" data-tab="home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5L12 3l9 7.5"/>
        <path d="M5 9.5V21h14V9.5"/>
      </svg>
      <span>Главное</span>
    </button>

    <button class="nav-btn" data-tab="subscription">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="5" width="20" height="14" rx="2"/>
        <path d="M2 10h20"/>
      </svg>
      <span>Подписки</span>
    </button>

    <button class="nav-btn" data-tab="settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
      </svg>
      <span>Профиль</span>
    </button>
  </nav>

<script>
(function () {
  /* ===== Telegram mock ===== */
  if (!window.Telegram || !window.Telegram.WebApp) {
    window.Telegram = {
      WebApp: {
        ready: () => {}, expand: () => {},
        HapticFeedback: {
          impactOccurred: () => {},
          notificationOccurred: () => {},
          selectionChanged: () => {}
        }
      }
    };
  }
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  function haptic(type) {
    try {
      const hf = tg.HapticFeedback;
      if (!hf) return;
      if (type === 'light') hf.impactOccurred('light');
      else if (type === 'select') hf.selectionChanged();
    } catch (e) {}
  }

  /* ===== STATE ===== */
  const TABS = ['home', 'subscription', 'settings'];
  let currentTab = 'home';
  let hoverTab = 'home';

  const island = document.getElementById('nav-island');
  const lens = document.getElementById('nav-lens');
  const blueWindow = document.getElementById('nav-blue-window');
  const blueTrack = document.getElementById('nav-blue-track');
  const buttons = Array.from(island.querySelectorAll('.nav-btn'));

  /* ===== SCREEN SWITCH ===== */
  function showScreen(tab) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const next = document.getElementById('screen-' + tab);
    if (next) next.classList.add('active');
    currentTab = tab;
  }

  /* ===== BUILD BLUE CLONES =====
     Копии кнопок, покрашенные в голубой. Позиционируются абсолютно
     по координатам, снятым с оригиналов. Кладём в blue-track. */
  function buildBlueClones() {
    blueTrack.innerHTML = '';
    const islandRect = island.getBoundingClientRect();

    buttons.forEach(btn => {
      const btnRect = btn.getBoundingClientRect();
      const left = btnRect.left - islandRect.left;
      const width = btnRect.width;
      const height = btnRect.height;

      const clone = document.createElement('div');
      clone.className = 'nav-blue-clone';
      clone.style.left = left + 'px';
      clone.style.top = '0';
      clone.style.width = width + 'px';
      clone.style.height = height + 'px';

      // Копируем иконку и текст
      const svg = btn.querySelector('svg');
      const span = btn.querySelector('span');
      if (svg) clone.appendChild(svg.cloneNode(true));
      if (span) clone.appendChild(span.cloneNode(true));

      blueTrack.appendChild(clone);
    });
  }

  /* ===== GEOMETRY CACHE ===== */
  let geo = null;

  function rebuildGeometry() {
    const ir = island.getBoundingClientRect();
    const pad = 6;
    const bs = buttons.map(b => {
      const r = b.getBoundingClientRect();
      return {
        tab: b.dataset.tab,
        left: r.left - ir.left,
        width: r.width,
        center: r.left - ir.left + r.width / 2,
        height: r.height
      };
    });

    const mids = [];
    for (let i = 0; i < bs.length - 1; i++) {
      mids.push((bs[i].center + bs[i + 1].center) / 2);
    }

    geo = { islandW: ir.width, pad, buttons: bs, mids };
  }

  function btnByTab(tab) {
    return geo.buttons.find(b => b.tab === tab);
  }

  /* ===== LENS + BLUE WINDOW =====
     Оба элемента двигаются одним и тем же transform и width.
     Внутренний трек сдвигается на -lensLeft, чтобы копии кнопок
     «стояли на месте» в координатах островка. */
  const MIN_STRETCH = 0;
  const MAX_STRETCH = 10;
  const STRETCH_K = 60;

  function applyLens(left, width, useTransition) {
    const t = useTransition ? '' : 'none';
    lens.style.transition = useTransition
      ? ''
      : 'none';
    blueWindow.style.transition = useTransition ? '' : 'none';
    blueTrack.style.transition = useTransition ? '' : 'none';

    lens.style.transform = `translate3d(${left}px, 0, 0)`;
    lens.style.width = width + 'px';

    blueWindow.style.transform = `translate3d(${left}px, 0, 0)`;
    blueWindow.style.width = width + 'px';

    // Трек смещаем на -left, чтобы копии кнопок визуально «стояли на месте»
    blueTrack.style.transform = `translate3d(${-left}px, 0, 0)`;
  }

  function snapTo(tab, useTransition) {
    const b = btnByTab(tab);
    if (!b) return;
    applyLens(b.left, b.width, useTransition);
  }

  /* ===== HOVER (для haptic и commit) ===== */
  function setHover(tab) {
    if (hoverTab === tab) return;
    hoverTab = tab;
    haptic('select');
  }

  function tabFromCenter(x) {
    if (x < geo.mids[0]) return geo.buttons[0].tab;
    if (x > geo.mids[geo.mids.length - 1]) return geo.buttons[geo.buttons.length - 1].tab;
    for (let i = 0; i < geo.mids.length - 1; i++) {
      if (x >= geo.mids[i] && x <= geo.mids[i + 1]) return geo.buttons[i + 1].tab;
    }
    let best = geo.buttons[0], bd = Infinity;
    for (const b of geo.buttons) {
      const d = Math.abs(b.center - x);
      if (d < bd) { bd = d; best = b; }
    }
    return best.tab;
  }

  /* ===== DRAG ===== */
  let pointerId = null;
  let startX = 0;
  let startY = 0;
  let lastX = 0;
  let lastT = 0;
  let velocity = 0;
  let didDrag = false;
  let pendingFrame = false;
  let pendingX = 0;
  const DRAG_THRESHOLD = 8;

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function pointerToLocal(clientX) {
    const ir = island.getBoundingClientRect();
    return clientX - ir.left;
  }

  function onPointerDown(e) {
    if (pointerId !== null) return;
    if (!geo) rebuildGeometry();

    pointerId = e.pointerId;
    try { island.setPointerCapture(pointerId); } catch (_) {}

    const localX = pointerToLocal(e.clientX);
    startX = localX;
    startY = e.clientY;
    lastX = localX;
    lastT = performance.now();
    velocity = 0;
    didDrag = false;
    pendingX = localX;

    const b = btnByTab(hoverTab) || geo.buttons[0];
    island.classList.add('dragging');
    applyLens(b.left, b.width, false);
  }

  function onPointerMove(e) {
    if (e.pointerId !== pointerId) return;

    const localX = pointerToLocal(e.clientX);
    const dxTotal = Math.abs(localX - startX);
    const dyTotal = Math.abs(e.clientY - startY);

    if (!didDrag && (dxTotal > DRAG_THRESHOLD || dyTotal > DRAG_THRESHOLD)) {
      didDrag = true;
    }
    if (!didDrag) return;

    pendingX = localX;

    const now = performance.now();
    const dt = Math.max(1, now - lastT);
    velocity = (localX - lastX) / dt;
    lastX = localX;
    lastT = now;

    if (!pendingFrame) {
      pendingFrame = true;
      requestAnimationFrame(renderDragFrame);
    }
  }

  function renderDragFrame() {
    pendingFrame = false;
    if (pointerId === null) return;

    const x = pendingX;
    const targetTab = tabFromCenter(x);
    const b = btnByTab(targetTab);
    if (!b) return;

    const stretch = clamp(Math.abs(velocity) * STRETCH_K, MIN_STRETCH, MAX_STRETCH);
    const baseWidth = b.width;
    const width = baseWidth + stretch;

    let left = x - width / 2;
    const minLeft = geo.pad;
    const maxLeft = geo.islandW - geo.pad - width;
    left = clamp(left, minLeft, maxLeft);

    applyLens(left, width, false);
    setHover(targetTab);
  }

  function onPointerUp(e) {
    if (e.pointerId !== pointerId) return;
    try { island.releasePointerCapture(pointerId); } catch (_) {}
    island.classList.remove('dragging');
    pointerId = null;

    if (didDrag && geo) {
      const targetTab = tabFromCenter(pendingX);
      setHover(targetTab);
      commit(targetTab);
      return;
    }

    const localX = pointerToLocal(e.clientX);
    commit(tabFromCenter(localX));
  }

  function onPointerCancel(e) {
    if (e.pointerId !== pointerId) return;
    island.classList.remove('dragging');
    pointerId = null;
    commit(currentTab);
  }

  function commit(tab) {
    if (!TABS.includes(tab)) tab = currentTab;
    hoverTab = tab;

    // Плавная доводка: включаем transition, применяем финальные координаты
    const b = btnByTab(tab);
    if (b) {
      lens.style.transition = '';
      blueWindow.style.transition = '';
      blueTrack.style.transition = '';
      applyLens(b.left, b.width, true);
    }

    if (tab !== currentTab) {
      showScreen(tab);
      haptic('light');
    } else {
      haptic('light');
    }
  }

  /* ===== EVENTS ===== */
  island.addEventListener('pointerdown', onPointerDown);
  island.addEventListener('pointermove', onPointerMove);
  island.addEventListener('pointerup', onPointerUp);
  island.addEventListener('pointercancel', onPointerCancel);

  buttons.forEach(btn => {
    btn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); });
  });
  island.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });

  /* ===== INIT ===== */
  function initAll() {
    rebuildGeometry();
    buildBlueClones();
    snapTo(currentTab, false);
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => requestAnimationFrame(initAll));
  }
  requestAnimationFrame(initAll);
  window.addEventListener('load', () => requestAnimationFrame(initAll));
  window.addEventListener('resize', () => {
    if (pointerId === null) {
      rebuildGeometry();
      buildBlueClones();
      snapTo(currentTab, false);
    }
  });

})();
</script>
</body>
</html>
